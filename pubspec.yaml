name: smartfarming
description: A Web and Android-Based Rice Field Monitoring, Rice Leaf Disease Detection, and Treatment Scheduling System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_database: ^12.1.3
  firebase_storage: 13.0.6
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1

  # State Management
  provider: ^6.1.1

  # Image & Camera
  image_picker: ^1.0.7
  camera: ^0.11.0+2
  image: ^4.1.3

  # ML Model
  tflite_flutter: ^0.12.1
  google_mlkit_text_recognition: ^0.16.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.65.0

  # Calendar
  table_calendar: ^3.0.9

  # HTTP
  http: ^1.1.2

  # Utilities
  url_launcher: ^6.2.2
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "lib/screens/logo/logo.png"
  adaptive_icon_background: "#41644A"
  adaptive_icon_foreground: "lib/screens/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - lib/screens/background/
    - lib/screens/logo/
